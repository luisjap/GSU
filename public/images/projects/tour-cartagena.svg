<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset="0.6" stop-color="#0d1f3c"/>
      <stop offset="1" stop-color="#1a3a5c"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5a300"/>
      <stop offset="1" stop-color="#e05c00"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a6b8a"/>
      <stop offset="1" stop-color="#0a3d55"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="58%" r="30%">
      <stop offset="0" stop-color="#f5a300" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f5a300" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="640" height="360" fill="url(#sky)"/>

  <!-- Glow behind sun -->
  <rect width="640" height="360" fill="url(#glow)"/>

  <!-- Horizon sea -->
  <rect x="0" y="210" width="640" height="150" fill="url(#sea)" rx="0"/>

  <!-- Sun -->
  <circle cx="320" cy="210" r="38" fill="url(#sun)" opacity="0.92"/>
  <!-- Sun reflection on sea -->
  <ellipse cx="320" cy="235" rx="18" ry="70" fill="#f5a300" opacity="0.12"/>

  <!-- Stars -->
  <circle cx="80" cy="55" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="160" cy="30" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="240" cy="70" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="400" cy="40" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="510" cy="65" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="580" cy="28" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="130" cy="90" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="470" cy="88" r="1" fill="#fff" opacity="0.4"/>

  <!-- Catamaran silhouette -->
  <!-- Hull left -->
  <ellipse cx="252" cy="218" rx="38" ry="7" fill="#0a1628"/>
  <!-- Hull right -->
  <ellipse cx="388" cy="218" rx="38" ry="7" fill="#0a1628"/>
  <!-- Deck bridge -->
  <rect x="258" y="208" width="124" height="8" rx="3" fill="#0d1f3c"/>
  <!-- Mast -->
  <line x1="320" y1="210" x2="320" y2="115" stroke="#f5a300" stroke-width="2.5" opacity="0.9"/>
  <!-- Main sail -->
  <polygon points="322,117 322,205 378,185" fill="#f5a300" opacity="0.22"/>
  <polygon points="318,117 318,205 262,178" fill="#f5a300" opacity="0.14"/>
  <!-- Sail outline -->
  <polyline points="322,117 378,185 322,205" fill="none" stroke="#f5a300" stroke-width="1" opacity="0.4"/>
  <polyline points="318,117 262,178 318,205" fill="none" stroke="#f5a300" stroke-width="1" opacity="0.25"/>

  <!-- Sea waves -->
  <path d="M0 242 q40-8 80 0 q40 8 80 0 q40-8 80 0 q40 8 80 0 q40-8 80 0 q40 8 80 0 q40-8 80 0 q40 8 80 0" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.12"/>
  <path d="M0 258 q50-6 100 0 q50 6 100 0 q50-6 100 0 q50 6 100 0 q50-6 100 0 q50 6 100 0 q50-6 40 0" fill="none" stroke="#fff" stroke-width="1" opacity="0.08"/>
  <path d="M0 275 q60-5 120 0 q60 5 120 0 q60-5 120 0 q60 5 120 0 q60-5 120 0 q60 5 40 0" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.06"/>

  <!-- Label top -->
  <text x="320" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" letter-spacing="5" fill="#f5a300" opacity="0.8">CARTAGENA · COLOMBIA</text>

  <!-- Brand name -->
  <text x="320" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="3" fill="#ffffff" opacity="0.95">TOUR CARTAGENA</text>
  <text x="320" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="normal" letter-spacing="7" fill="#f5a300" opacity="0.7">TRAVEL</text>
</svg>
